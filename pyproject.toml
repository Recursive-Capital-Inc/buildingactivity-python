[project]
name = "buildingactivity"
version = "0.1.0"
description = "Hosted MCP server and an undistributed command line client for the BuildingActivity building-permit API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Recursive Capital Inc." }]
keywords = ["building permits", "construction", "real estate", "mcp", "api client"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Information Analysis",
    # Not published to PyPI (owner decision 2026-10-28): PyPI refuses uploads with this.
    "Private :: Do Not Upload",
]
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
# The MCP server (buildingactivity-mcp); the CLI needs only requests.
mcp = ["mcp>=2.3,<3", "uvicorn>=0.30"]
dev = ["pytest>=8", "jsonschema>=4", "httpx>=0.27", "ruff>=0.6", "build>=1.2"]

[project.urls]
Homepage = "https://buildingactivity.com"
Documentation = "https://buildingactivity.com/api"
Source = "https://github.com/Recursive-Capital-Inc/buildingactivity-python"

[project.scripts]
buildingactivity = "buildingactivity.cli.main:main"
buildingactivity-mcp = "buildingactivity.mcp.server:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"buildingactivity.cli" = ["spec.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
